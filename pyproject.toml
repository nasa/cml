[project]
name = "cml"
version = "0.2.0"
description = "The JSC Engineering EG Division Common Model Library"
dependencies = [
    "breathe",
    "docutils",
    "gcovr",
    "guardonce",
    "numpy",
    "psutil",
    "pyyaml",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://nasa.github.io/cml"
Documentation = "https://nasa.github.io/cml"
Repository = "https://github.com/nasa/cml"
Issues = "https://github.com/nasa/cml/issues"
Changelog = "https://github.com/nasa/cml/blob/main/CHANGELOG"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
