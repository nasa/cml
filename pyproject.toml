[project]
name = "cml"
version = "0.2.0"
description = "The JSC Engineering EG Division Common Model Library"
dependencies = [
    "gcovr",
    "guardonce",
    "numpy",
    "psutil",
    "pyyaml",
    "regex",
    "ruff",
]

[project.urls]
Documentation = "https://github.com/nasa/cml/wiki"
Issues = "https://github.com/nasa/cml/issues"
Source = "https://github.com/nasa/cml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff.lint]
ignore = [
    "S102",  # exec(), will fix in the future
    "SIM115"  # Same as S102, will fix in the future
]
exclude = ["**/build/*"]
per-file-ignores = {
    "models/**" = [
        "F821",  # Undefined name errors in input files.
        "N999",  # Doesn't really matter for unit test code
        "RUF012",  # Doesn't really matter for unit test code
    ]
}
